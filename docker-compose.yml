services:
  postgres:
    image: postgres:16-alpine
    container_name: academic-compliance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic
      POSTGRES_DB: academic_compliance
    ports:
      - "5432:5432"
    volumes:
      - academic_pg_data:/var/lib/postgresql/data

volumes:
  academic_pg_data:
